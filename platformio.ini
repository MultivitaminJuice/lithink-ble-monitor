; PlatformIO build. Arduino IDE users can ignore this file (see README).
[platformio]
src_dir = .

[env:esp32dev]
; Pinned to an ESP32 Arduino 2.0.x core (IDF 4.4). NimBLE-Arduino 1.4.x is built
; for core 2.x; the current core 3.x (IDF 5.x) makes NimBLE 1.4.x abort at
; esp_bt_controller_init on boot. Arduino IDE users: install esp32 boards 2.0.x.
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17
; Two 1.9 MB app slots + small SPIFFS → leaves headroom AND supports OTA.
; Arduino IDE equivalent: Tools -> Partition Scheme -> "Minimal SPIFFS (1.9MB APP with OTA)".
board_build.partitions = min_spiffs.csv
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.3

; To flash over the network after the first USB flash, uncomment and set:
; upload_protocol = espota
; upload_port = lithink-bridge.local
; upload_flags = --auth=<your-ota-password>
